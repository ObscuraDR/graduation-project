services:
  # IDS Backend API
  ids-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ids-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./backend/models:/app/backend/models
      - ./logs:/app/logs
      - ./backend/data:/app/backend/data
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    networks:
      - ids-network
    depends_on:
      - postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    cap_add:
      - NET_RAW
      - NET_ADMIN
    privileged: true

  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: ids-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ids_db}
      POSTGRES_USER: ${POSTGRES_USER:-ids_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ids_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ids-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: ids-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - ids-network
    depends_on:
      - ids-backend
    restart: unless-stopped

  # React Dashboard
  dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ids-dashboard
    ports:
      - "3000:80"
    networks:
      - ids-network
    depends_on:
      - ids-backend
    restart: unless-stopped

networks:
  ids-network:
    driver: bridge

volumes:
  postgres-data:
